function colorForIndex(index, bgMode) {
  const preset = GRAPH_BG_PRESETS[bgMode] || GRAPH_BG_PRESETS.light;
  return preset.colors[index % preset.colors.length];
}

function gaussian(x, mu, sigma) {
  return Math.exp(-0.5 * Math.pow((x - mu) / Math.max(1, sigma), 2));
}

function pseudoRandom(seed) {
  const v = Math.sin(seed * 9999) * 10000;
  return v - Math.floor(v);
}

function safeGet(key, fallback) {
  try {
    const raw = window.localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function safeSet(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

function normalizeCompound(item, index = 0, source = "external") {
  const raw = Array.isArray(item?.peaks) ? item.peaks : [];
  const peaks = raw
    .map((p) => ({
      x: Number(p?.x ?? p?.wavenumber ?? p?.[0]),
      a: Number(p?.a ?? p?.intensity ?? p?.[1] ?? 0.5),
      w: Number(p?.w ?? p?.width ?? p?.[2] ?? 30),
      label: String(p?.label ?? p?.assignment ?? p?.[3] ?? "external"),
    }))
    .filter((p) => Number.isFinite(p.x) && Number.isFinite(p.a) && Number.isFinite(p.w));

  return {
    id: String(item?.id || `ext_${index}`),
    name: String(item?.name || `External ${index + 1}`),
    formula: String(item?.formula || "s/d"),
    category: String(item?.category || item?.domain || "External"),
    cp: String(item?.cp || "s/d"),
    source: String(item?.source || source),
    peaks,
  };
}

function smooth(values, radius) {
  if (radius <= 1) return values;
  return values.map((_, i) => {
    let sum = 0;
    let n = 0;
    for (let j = i - radius; j <= i + radius; j += 1) {
      if (j >= 0 && j < values.length) {
        sum += values[j];
        n += 1;
      }
    }
    return sum / Math.max(1, n);
  });
}

function generateSpectrum(compounds, selected, params) {
  const xs = [];
  for (let x = 4000; x >= 300; x -= 5) xs.push(x);

  let ys = xs.map((x, i) => {
    let y = 0;
    for (const c of compounds) {
      const amount = Number(selected[c.id] || 0);
      if (amount <= 0) continue;
      for (const p of c.peaks) {
        y += amount * params.pathLength * p.a * gaussian(x, p.x + params.shift, p.w + params.broadening);
      }
    }
    const base = params.baseline * (1 + 0.35 * Math.sin((x - 300) / 420)) + params.slope * ((x - 2200) / 2000);
    const noise = (pseudoRandom(i + xs.length * 0.37) - 0.5) * params.noise;
    return Math.max(0, y + base + noise);
  });

  ys = smooth(ys, Math.max(1, Math.round(params.resolution / 3)));
  if (params.mode === "transmittance") ys = ys.map((a) => 100 * Math.pow(10, -a));

  return xs.map((x, i) => ({ x, y: ys[i] }));
}

function normalizeY(data) {
  if (!data.length) return [];
  const max = Math.max(...data.map((d) => d.y));
  const min = Math.min(...data.map((d) => d.y));
  const range = max - min || 1;
  return data.map((d) => ({ ...d, y: (d.y - min) / range }));
}

function detectPeaks(data, maxCount = 8, minSpacing = 85, mode = "absorbance") {
  const normalized = normalizeY(data);
  const signal = normalized.map((r) => ({ ...r, s: mode === "transmittance" ? 1 - r.y : r.y }));
  const candidates = signal
    .filter((r, i, arr) => i > 2 && i < arr.length - 3 && r.s > arr[i - 1].s && r.s > arr[i + 1].s && r.s > 0.16)
    .sort((a, b) => b.s - a.s);

  const picked = [];
  for (const p of candidates) {
    if (!picked.some((q) => Math.abs(q.x - p.x) < minSpacing)) picked.push({ x: p.x, y: p.s });
    if (picked.length >= maxCount) break;
  }
  return picked.sort((a, b) => b.x - a.x);
}

    [250, 650, "M-O / inorganic lattice"],
  ];
  const match = rules.find(([a, b]) => x >= a && x <= b);
  return { label: match ? match[2] : "fingerprint" };
}

function parseFileText(text) {
  const rows = String(text || "")
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);

  const xy = [];
  for (const line of rows) {
    const upper = line.toUpperCase();
    if (line.startsWith("#") || upper.includes("TITLE") || upper.includes("END") || upper.includes("XYDATA") || upper.includes("JCAMP")) continue;
    const normalizedLine = line.replace(/;/g, " ").replace(/\t/g, " ").replace(/\s+/g, " ").trim();
    let parts = normalizedLine.split(" ");
    if (parts.length < 2 && normalizedLine.includes(",")) parts = normalizedLine.split(",");
    const nums = parts.map((v) => Number(String(v).replace(",", "."))).filter(Number.isFinite);
    if (nums.length >= 2) xy.push({ x: nums[0], y: nums[1] });
  }

  const clean = xy.sort((a, b) => b.x - a.x).filter((d) => d.x <= 4200 && d.x >= 250);
  return clean.length > 8 ? clean : null;
}

function similarity(a, b) {
  const na = normalizeY(a);
  const nb = normalizeY(b);
  let dot = 0;
  let aa = 0;
  let bb = 0;
  for (let i = 0; i < Math.min(na.length, nb.length); i += 1) {
    dot += na[i].y * nb[i].y;
    aa += na[i].y ** 2;
    bb += nb[i].y ** 2;
  }
  return dot / (Math.sqrt(aa) * Math.sqrt(bb) || 1);
}

function dataUrl(mime, text) {
  try {
    return "data:" + mime + ";charset=utf-8;base64," + btoa(unescape(encodeURIComponent(String(text))));
  } catch {
    return "data:" + mime + ";charset=utf-8," + encodeURIComponent(String(text));
  }
}

function matchDetails(unknown, compound, mode = "absorbance") {
  const exp = detectPeaks(unknown || [], 16, 70, mode);
  const matched = [];
  const missing = [];
  for (const ref of compound.peaks || []) {
    const best = exp.map((p) => ({ p, delta: Math.abs(p.x - ref.x) })).sort((a, b) => a.delta - b.delta)[0];
    if (best && best.delta <= 45) matched.push({ ref: ref.x, exp: best.p.x, label: ref.label || interpretPeak(ref.x).label });
    else missing.push({ ref: ref.x, label: ref.label || interpretPeak(ref.x).label });
  }
  return { matched, missing, source: compound.source || "internal library" };
}

function filterDomain(compounds, domain) {
  if (domain === "automatic") return compounds;
  return compounds.filter((c) => {
    const cat = c.category.toLowerCase();
    if (domain === "organics") return ["alcohols", "ketones", "esters", "acids", "aromatics", "amines", "nitriles", "sulfur compounds", "biomolecules", "biomass pyrolysis", "amino acids", "pharmaceuticals", "solvents"].includes(cat);
    if (domain === "polymers") return cat.includes("polymer");
    if (domain === "minerals") return cat.includes("mineral") || cat.includes("oxide");
    if (domain === "gases") return cat.includes("gases") || cat.includes("vapors");
    if (domain === "pyrolysis") return cat.includes("biomass");
    return true;
  });
}

function estimateComposition(unknown, compounds, params, domain) {
  if (!unknown) return [];
  const candidates = filterDomain(compounds, domain)
    .map((c) => {
      const ref = generateSpectrum([c], { [c.id]: 1 }, { ...params, noise: 0, baseline: 0, slope: 0, shift: 0, broadening: 0 });
      const score = Math.max(0, similarity(unknown, ref));
      const details = matchDetails(unknown, c, params.mode);
      const totalPeaks = Math.max(1, details.matched.length + details.missing.length);
      const peakFactor = details.matched.length / totalPeaks;
      const weight = Math.pow(score, 2) * (0.55 + 0.45 * peakFactor);
      return { compound: c, score, weight, matched: details.matched.length, missing: details.missing.length, source: details.source };
    })
    .filter((r) => r.score > 0.05)
    .sort((a, b) => b.weight - a.weight)
    .slice(0, 8);

  const total = candidates.reduce((s, r) => s + r.weight, 0) || 1;
  return candidates.map((r) => ({ ...r, percent: (r.weight / total) * 100 })).filter((r) => r.percent >= 1);
}

function numberFormat(value, step) {
  return Number(value).toFixed(step < 0.01 ? 3 : 2);
}

    if (viewMode === "stacked") {

      const width = 900;
      const heightPerSvg = 180;
      const gap = 20;
      const totalHeight = svgs.length * heightPerSvg + (svgs.length - 1) * gap;
      let combined = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${totalHeight}" viewBox="0 0 ${width} ${totalHeight}"><rect width="${width}" height="${totalHeight}" fill="${figureBg || '#ffffff'}" />`;

      return combined;

function SpectrumChart(props) {
  const width = 980;
  const height = 400;
  const padLeft = 82;
  const padRight = 20;
  const padTop = 20;
  const padBottom = 54;
  const fullMin = 300;
  const fullMax = 4000;
  const range = fullMax - fullMin;
  const visibleRange = range / Math.max(Number(props.zoomX || 1), 0.5);
  const center = 2150 + Number(props.panX || 0) * Math.max(0, (range - visibleRange) / 2);
  const minX = Math.max(fullMin, center - visibleRange / 2);
  const maxX = Math.min(fullMax, center + visibleRange / 2);
  const visible = props.data.filter((d) => d.x >= minX && d.x <= maxX);
  const baseMax = Math.max(...visible.map((d) => d.y), props.mode === "transmittance" ? 100 : 1);
  const yMax = Math.max(baseMax / Math.max(Number(props.zoomY || 1), 0.1), 0.05);
  const plotW = width - padLeft - padRight;
  const plotH = height - padTop - padBottom;
  const toX = (x) => padLeft + ((maxX - x) / (maxX - minX || 1)) * plotW;
  const toY = (y) => padTop + (1 - Math.min(y, yMax) / (yMax || 1)) * plotH;
  const linePoints = (series) => series.filter((d) => d.x >= minX && d.x <= maxX).map((d) => `${toX(d.x)},${toY(d.y)}`).join(" ");
  const totalPoints = linePoints(visible);
  const componentPoints = props.componentSpectra.map((s) => ({ ...s, points: linePoints(s.data) }));
  const unknownPoints = props.unknown
    ? linePoints(normalizeY(props.unknown.filter((d) => d.x >= minX && d.x <= maxX)).map((d) => ({ x: d.x, y: d.y * yMax })))
    : "";
  const labels = detectPeaks(visible, props.markerLimit, Number(props.markerSpacing || 95), props.mode).map((p, i) => ({
    number: i + 1,
    x: p.x,
    px: toX(p.x),
    py: props.mode === "transmittance" ? toY(Math.max(0, yMax * (1 - p.y))) : toY(p.y),
    info: interpretPeak(p.x),
  }));
  const density = Math.max(1, Math.min(4, Math.round(Number(props.gridDensity || 1))));
  const xStep = density === 1 ? 500 : density === 2 ? 250 : density === 3 ? 100 : 50;
  const yDivs = density === 1 ? 4 : density === 2 ? 8 : density === 3 ? 10 : 20;
  const xTicks = [];
  for (let t = Math.floor(maxX / xStep) * xStep; t >= Math.ceil(minX / xStep) * xStep; t -= xStep) {
    if (t >= minX && t <= maxX) xTicks.push(t);
  }
  const yTicks = Array.from({ length: yDivs + 1 }, (_, i) => (i / yDivs) * yMax);
  const preset = GRAPH_BG_PRESETS[props.graphBgMode] || GRAPH_BG_PRESETS.light;

  return (
    <div
      className="relative w-full h-full min-h-[320px] overflow-hidden rounded-xl"
      style={{ background: props.figureBg }}
      onWheel={(e) => {
        e.preventDefault();
        const next = e.deltaY < 0 ? Math.min(8, props.zoomX + 0.15) : Math.max(0.5, props.zoomX - 0.15);
        props.setZoomX(next);
      }}
    >
      <svg
        id="ftir-chart-svg"
        viewBox={`0 0 ${width} ${height}`}
        className="absolute inset-0 w-full h-full"
        style={{ fontFamily: props.axisFontFamily }}
        onMouseMove={(e) => {
          const box = e.currentTarget.getBoundingClientRect();
          const x = ((e.clientX - box.left) / box.width) * width;
          const y = ((e.clientY - box.top) / box.height) * height;
          if (props.dragLegend) {
            props.setLegendX(Math.max(6, Math.min(width - 308, x)));
            props.setLegendY(Math.max(6, Math.min(height - 80, y)));
          }
          if (props.dragCompoundLegend) {
            props.setCompoundLegendX(Math.max(6, Math.min(width - 220, x)));
            props.setCompoundLegendY(Math.max(6, Math.min(height - 50, y)));
          }
        }}
        onMouseUp={() => {
          props.setDragLegend(false);
          props.setDragCompoundLegend(false);
        }}
        onMouseLeave={() => {
          props.setDragLegend(false);
          props.setDragCompoundLegend(false);
        }}
      >
        <rect width={width} height={height} fill={props.figureBg} />
        {props.overlayUrl && (
          <image
            href={props.overlayUrl}
            x="0"
            y="0"
            width={width}
            height={height}
            preserveAspectRatio="xMidYMid meet"
            opacity={props.overlayOpacity}
            transform={`translate(${props.overlayX} ${props.overlayY}) translate(${width / 2} ${height / 2}) scale(${props.overlayScale * props.overlayScaleX} ${props.overlayScale * props.overlayScaleY}) rotate(${props.overlayRotate}) translate(${-width / 2} ${-height / 2})`}
          />
        )}

        {/* Grid lines and tick labels */}
        {xTicks.map((t) => (
          <g key={t}>
            <line x1={toX(t)} y1={padTop} x2={toX(t)} y2={height - padBottom} stroke={props.gridColor} strokeOpacity="0.5" strokeDasharray="4 3" />
            <line x1={toX(t)} y1={height - padBottom} x2={toX(t)} y2={height - padBottom + 5} stroke={props.axisColor} strokeWidth="1.2" />
            <text x={toX(t)} y={height - padBottom + 19} fontSize={props.axisFontSize} textAnchor="middle" fill={props.axisColor}>{t}</text>
          </g>
        ))}
        {yTicks.map((t) => (
          <g key={t}>
            <line x1={padLeft} y1={toY(t)} x2={width - padRight} y2={toY(t)} stroke={props.gridColor} strokeOpacity="0.5" strokeDasharray="4 3" />
            <line x1={padLeft - 5} y1={toY(t)} x2={padLeft} y2={toY(t)} stroke={props.axisColor} strokeWidth="1.2" />
            <text x={padLeft - 8} y={toY(t) + 4} fontSize={props.axisFontSize} fill={props.axisColor} textAnchor="end">{t.toFixed(props.mode === "transmittance" ? 0 : 2)}</text>
          </g>
        ))}

        {/* Axes */}
        <line x1={padLeft} y1={height - padBottom} x2={width - padRight} y2={height - padBottom} stroke={props.axisColor} strokeWidth="1.5" />
        <line x1={padLeft} y1={padTop} x2={padLeft} y2={height - padBottom} stroke={props.axisColor} strokeWidth="1.5" />

        {props.colorMode === "compound" && componentPoints.map((s) => (
          <polyline key={s.compound.id} points={s.points} fill="none" stroke={colorForIndex(s.index, props.graphBgMode)} strokeWidth="2.2" opacity="0.95" />
        ))}
        <polyline points={totalPoints} fill="none" stroke={props.curveColor} strokeWidth={props.colorMode === "compound" ? "1.5" : "2.4"} opacity={props.colorMode === "compound" ? "0.55" : "1"} />

            ))}
          </g>
        )}

        {props.colorMode === "compound" && props.componentSpectra.length > 0 && (
          <g onMouseDown={() => props.setDragCompoundLegend(true)} style={{ cursor: "move" }}>
            <rect x={props.compoundLegendX - 8} y={props.compoundLegendY - 14} width="220" height={Math.max(32, 18 + Math.min(props.componentSpectra.length, 7) * 18)} rx="8" fill={preset.legendFill} fillOpacity={props.compoundLegendOpacity} stroke={preset.legendStroke} />

              <g key={s.compound.id}>
                <rect x={props.compoundLegendX} y={props.compoundLegendY + i * 18} width="9" height="9" fill={colorForIndex(s.index, props.graphBgMode)} />

          </g>
        )}

        {/* Axis titles */}
        <text x={(padLeft + width - padRight) / 2} y={height - 6} fontSize={props.axisFontSize + 1} textAnchor="middle" fill={props.axisColor} fontWeight="600">{props.xAxisTitle}</text>

    </div>
  );
}

function StackedSpectra({ componentSpectra, mode, colorMode, graphBgMode, axisFontSize, axisFontFamily, gridColor, axisColor, figureBg, showPeakLabels }) {

function MiniChart({ data, mode, color, axisFontSize, axisFontFamily, gridColor, axisColor, figureBg, showPeakLabels }) {
  const width = 900;
  const height = 210;
  const pad = 40;
  const yMax = Math.max(...data.map((d) => d.y), 0.001);
  const toX = (x) => pad + ((4000 - x) / (4000 - 300)) * (width - pad * 2);
  const toY = (y) => height - pad - (y / yMax) * (height - pad * 2);
  const points = data.map((d) => `${toX(d.x)},${toY(d.y)}`).join(" ");
  const labels = detectPeaks(data, 5, 90, mode).map((p, i) => ({ 
    ...p, 
    number: i + 1, 
    px: toX(p.x), 
    py: mode === "transmittance" ? toY(Math.max(0, yMax * (1 - p.y))) : toY(yMax * p.y) 
  }));
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ fontFamily: axisFontFamily }}>
      <rect width={width} height={height} fill={figureBg} />
      {[4000, 3000, 2000, 1000, 500, 300].map((t) => (
        <g key={t}>
          <line x1={toX(t)} y1={22} x2={toX(t)} y2={height - pad} stroke={gridColor} />
          <text x={toX(t)} y={height - 10} fontSize={axisFontSize} textAnchor="middle" fill={axisColor}>{t}</text>
        </g>
      ))}
      <line x1={pad} y1={height - pad} x2={width - pad} y2={height - pad} stroke={axisColor} strokeWidth="1.5" />
      <line x1={pad} y1={22} x2={pad} y2={height - pad} stroke={axisColor} strokeWidth="1.5" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2" />
      {showPeakLabels && labels.map((p) => (
        <g key={p.number}>
          <circle cx={p.px} cy={p.py} r="7" fill="white" stroke={color} strokeWidth="1.2" />
          <text x={p.px} y={p.py + 3.5} fontSize="8" textAnchor="middle" fill={axisColor}>{p.number}</text>
        </g>
      ))}
    </svg>
  );
}

        <button onClick={() => { props.setLegendX(640); props.setLegendY(26); }} className="px-2.5 py-1.5 rounded-lg bg-slate-700/60 text-xs hover:bg-slate-600/60 active:scale-[0.97] border border-slate-700/40">↑ Picos arriba</button>
        <button onClick={() => { props.setLegendX(640); props.setLegendY(240); }} className="px-2.5 py-1.5 rounded-lg bg-slate-700/60 text-xs hover:bg-slate-600/60 active:scale-[0.97] border border-slate-700/40">↓ Picos abajo</button>
        <button onClick={() => { props.setCompoundLegendX(46); props.setCompoundLegendY(28); }} className="px-2.5 py-1.5 rounded-lg bg-slate-700/60 text-xs hover:bg-slate-600/60 active:scale-[0.97] border border-slate-700/40">↑ Comp. arriba</button>
        <button onClick={() => { props.setCompoundLegendX(46); props.setCompoundLegendY(240); }} className="px-2.5 py-1.5 rounded-lg bg-slate-700/60 text-xs hover:bg-slate-600/60 active:scale-[0.97] border border-slate-700/40">↓ Comp. abajo</button>
      </div>
      <div className="text-[10px] text-slate-500 mt-1">Tip: arrastra las leyendas directamente en el gráfico para reposicionarlas.</div>
    </>
  );
}

/* ── Axes & Typography ── */
function AxisControls(props) {
  return (
    <>
      <Control label="Tamaño letra ejes" value={props.axisFontSize} min={8} max={22} step={1} onChange={props.setAxisFontSize} />
      <TextInput label="Título eje X" value={props.xAxisTitle} onChange={props.setXAxisTitle} />
      <TextInput label="Título eje Y" value={props.yAxisTitle} onChange={props.setYAxisTitle} />
      <div className="text-[10px] text-slate-500">Los títulos de ejes se posicionan automáticamente sin superposición.</div>
      <label className="block">
        <div className="text-sm text-slate-400 mb-1">Fuente de ejes</div>
        <select value={props.axisFontFamily} onChange={(e) => props.setAxisFontFamily(e.target.value)} className="w-full bg-slate-800/80 rounded-xl px-3 py-2 border border-slate-700/50 text-sm focus:border-sky-500/50 focus:outline-none">
          <option>Arial</option>
          <option>Times New Roman</option>
          <option>Georgia</option>
          <option>Helvetica</option>
          <option>Courier New</option>
          <option>Verdana</option>
          <option>Inter</option>
        </select>
      </label>
    </>
  );
}

function InstrumentControls(props) {
  return (
    <>
      <Control label="Ruido" value={props.noise} min={0} max={0.08} step={0.001} onChange={props.setNoise} />
      <Control label="Línea base" value={props.baseline} min={0} max={0.25} step={0.005} onChange={props.setBaseline} />
      <Control label="Pendiente" value={props.slope} min={-0.08} max={0.08} step={0.002} onChange={props.setSlope} />
      <Control label="Camino óptico" value={props.pathLength} min={0.1} max={3} step={0.05} onChange={props.setPathLength} />
      <Control label="Resolución" value={props.resolution} min={1} max={20} step={1} onChange={props.setResolution} />
      <Control label="Desplazamiento picos" value={props.shift} min={-30} max={30} step={1} onChange={props.setShift} />
      <Control label="Ensanchamiento" value={props.broadening} min={0} max={40} step={1} onChange={props.setBroadening} />
    </>
  );
}

function ImageControls(props) {
  return (
    <>
      <label className="block cursor-pointer text-center px-4 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 font-semibold text-sm hover:from-emerald-400 hover:to-emerald-500 active:scale-[0.98] btn-shine">Importar imagen JPG/PNG<input type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" onChange={props.handleOverlayImport} className="hidden" /></label>
      {props.overlayName && <div className="rounded-xl bg-slate-900 border border-slate-700 px-3 py-2 text-xs text-emerald-300 break-all">{props.overlayName}</div>}
      {props.overlayUrl && <button onClick={props.clearOverlay} className="w-full px-3 py-2 rounded-xl bg-red-500/20 text-red-200 border border-red-500/30 text-sm">Quitar imagen</button>}
      {props.overlayUrl && (
        <>
          <Control label="Transparencia" value={props.overlayOpacity} min={0} max={1} step={0.01} onChange={props.setOverlayOpacity} />
          <Control label="Escala general" value={props.overlayScale} min={0.4} max={2.5} step={0.01} onChange={props.setOverlayScale} />
          <Control label="Escala X" value={props.overlayScaleX} min={0.2} max={2.5} step={0.01} onChange={props.setOverlayScaleX} />
          <Control label="Escala Y" value={props.overlayScaleY} min={0.2} max={2.5} step={0.01} onChange={props.setOverlayScaleY} />
          <Control label="Mover X" value={props.overlayX} min={-400} max={400} step={1} onChange={props.setOverlayX} />
          <Control label="Mover Y" value={props.overlayY} min={-300} max={300} step={1} onChange={props.setOverlayY} />
          <Control label="Rotación" value={props.overlayRotate} min={-10} max={10} step={0.2} onChange={props.setOverlayRotate} />
        </>
      )}
    </>
  );
}

function DataControls(props) {
  return (
    <>
      {/* Import section */}
      <div className="space-y-2">
        <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">Importar espectro</div>
        <label className="block cursor-pointer text-center px-4 py-3 rounded-xl bg-gradient-to-r from-sky-500 to-sky-600 text-slate-950 font-semibold text-sm hover:from-sky-400 hover:to-sky-500 active:scale-[0.98] btn-shine">
          <span className="flex items-center justify-center gap-2">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" strokeLinecap="round" strokeLinejoin="round"/><polyline points="17 8 12 3 7 8" strokeLinecap="round" strokeLinejoin="round"/><line x1="12" y1="3" x2="12" y2="15" strokeLinecap="round"/></svg>
            CSV / TXT / JCAMP / DPT
          </span>
          <input type="file" accept=".csv,.txt,.jdx,.dx,.dpt" onChange={props.handleSpectrumImport} className="hidden" />
        </label>
      </div>

      {/* Status indicator */}
      {props.unknown && (
        <div className="rounded-xl bg-sky-500/10 border border-sky-500/25 px-3 py-2.5 flex items-center gap-2">
          <span className="w-2 h-2 rounded-full bg-sky-400 animate-pulse shrink-0" />
          <div className="flex-1 min-w-0">
            <div className="text-xs text-sky-200 font-medium">Espectro cargado</div>
            <div className="text-[10px] text-slate-400">{props.unknown.length} puntos de datos</div>
          </div>
          <button onClick={() => props.setUnknown(null)} className="px-2 py-1 rounded-lg bg-red-500/20 text-red-300 border border-red-500/30 text-[10px] font-medium hover:bg-red-500/30 shrink-0">✕ Quitar</button>
        </div>
      )}

      {/* Paste section */}
      <PasteBox pasteText={props.pasteText} setPasteText={props.setPasteText} handlePasteSpectrum={props.handlePasteSpectrum} />

      {/* External library */}
      <div className="space-y-2">
        <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">Biblioteca externa</div>
        <label className="block cursor-pointer text-center px-4 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-purple-600 text-slate-950 font-semibold text-sm hover:from-purple-400 hover:to-purple-500 active:scale-[0.98] btn-shine">
          <span className="flex items-center justify-center gap-2">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M4 19.5A2.5 2.5 0 016.5 17H20" strokeLinecap="round" strokeLinejoin="round"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Cargar biblioteca JSON
          </span>
          <input type="file" accept=".json,application/json" onChange={props.handleExternalLibraryImport} className="hidden" />
        </label>
        {props.externalInfo && (
          <div className="rounded-xl bg-purple-500/10 border border-purple-500/25 px-3 py-2 flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-purple-400 shrink-0" />
            <div className="text-xs text-purple-200 min-w-0 truncate">{props.externalInfo.name} · {props.externalInfo.total || props.externalInfo.count} compuestos</div>
          </div>
        )}
      </div>

      {/* Database reference */}
      <div className="rounded-xl bg-slate-800/40 border border-slate-700/40 p-3 space-y-1.5">
        <div className="text-xs text-slate-400 font-medium">📚 Bases de datos abiertas</div>
        <div className="text-[10px] text-slate-500 leading-relaxed">Puedes descargar espectros JCAMP-DX desde estas fuentes gratuitas y cargarlos aquí:</div>
        <div className="flex flex-col gap-1">
          <a href="https://sdbs.db.aist.go.jp/" target="_blank" rel="noopener noreferrer" className="text-[10px] text-sky-400 hover:text-sky-300 underline">• AIST SDBS — Spectral Database for Organic Compounds</a>
          <a href="https://webbook.nist.gov/chemistry/" target="_blank" rel="noopener noreferrer" className="text-[10px] text-sky-400 hover:text-sky-300 underline">• NIST Chemistry WebBook — IR Spectra</a>
          <a href="https://www.sigmaaldrich.com/technical-documents/articles/biology/ir-spectrum-table.html" target="_blank" rel="noopener noreferrer" className="text-[10px] text-sky-400 hover:text-sky-300 underline">• Sigma-Aldrich — IR Spectrum Reference</a>
        </div>
      </div>

      {/* Match results */}
      {props.unknown && props.matches && props.matches.length > 0 && (
        <div className="rounded-xl bg-slate-900 border border-slate-700 p-3 space-y-2">
          <div className="flex items-center gap-2">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-emerald-400"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" strokeLinecap="round"/></svg>
            <h3 className="font-semibold text-sm">Coincidencias detectadas</h3>
            <span className="text-[10px] text-emerald-400 ml-auto bg-emerald-500/10 px-1.5 py-0.5 rounded">{props.matches.length}</span>
          </div>
          <MatchesList matches={props.matches} unknown={props.unknown} mode="absorbance" />
        </div>
      )}
    </>
  );
}

function Collapsible({ title, children, defaultOpen = false, icon }) {
  const icons = {
    instrument: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-emerald-400 shrink-0"><path d="M12 20V10" strokeLinecap="round"/><path d="M18 20V4" strokeLinecap="round"/><path d="M6 20v-4" strokeLinecap="round"/></svg>,
    eye: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-sky-400 shrink-0"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
    zoom: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-sky-400 shrink-0"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35" strokeLinecap="round"/><path d="M11 8v6M8 11h6" strokeLinecap="round"/></svg>,
    palette: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-violet-400 shrink-0"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="12" r="1.5" fill="currentColor"/><circle cx="16" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/></svg>,
    tag: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-amber-400 shrink-0"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z" strokeLinecap="round" strokeLinejoin="round"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>,
    type: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-cyan-400 shrink-0"><path d="M4 7V4h16v3" strokeLinecap="round" strokeLinejoin="round"/><path d="M9 20h6" strokeLinecap="round"/><path d="M12 4v16" strokeLinecap="round"/></svg>,
    image: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-purple-400 shrink-0"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>,
    data: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-amber-400 shrink-0"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" strokeLinecap="round" strokeLinejoin="round"/><polyline points="7 10 12 15 17 10" strokeLinecap="round" strokeLinejoin="round"/><line x1="12" y1="15" x2="12" y2="3" strokeLinecap="round"/></svg>,
  };
  return (
    <details open={defaultOpen} className="group rounded-xl bg-slate-800/60 border border-slate-700/50 p-3 hover:border-slate-600/60">
      <summary className="font-semibold cursor-pointer select-none flex items-center gap-2 text-sm">
        {icon && icons[icon]}
        <span className="flex-1">{title}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="text-slate-500 group-open:rotate-180 transition-transform duration-200" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div className="space-y-3 mt-3 pt-3 border-t border-slate-700/30">{children}</div>
    </details>
  );
}

function Badge({ children }) {
  return <span className="px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/60 text-xs flex items-center gap-1">{children}</span>;
}

function Button({ children, onClick, tone = "slate" }) {
  const styles = {
    green: "bg-gradient-to-r from-emerald-500 to-emerald-600 text-slate-950 hover:from-emerald-400 hover:to-emerald-500 shadow-emerald-500/20",
    sky: "bg-gradient-to-r from-sky-500 to-sky-600 text-slate-950 hover:from-sky-400 hover:to-sky-500 shadow-sky-500/20",
    cyan: "bg-gradient-to-r from-cyan-500 to-cyan-600 text-slate-950 hover:from-cyan-400 hover:to-cyan-500 shadow-cyan-500/20",
    red: "bg-gradient-to-r from-red-500 to-red-600 text-white hover:from-red-400 hover:to-red-500 shadow-red-500/20",
    slate: "bg-slate-700/80 text-slate-200 hover:bg-slate-600/80",
  };
  return <button onClick={onClick} className={`px-3.5 py-1.5 rounded-xl font-semibold text-sm shadow-sm hover:shadow-md active:scale-[0.97] ${styles[tone] || styles.slate}`}>{children}</button>;
}

function SmallButton({ children, onClick, tone = "green" }) {
  const cls = tone === "red" ? "bg-red-500/20 text-red-200 border-red-500/30 hover:bg-red-500/30" : "bg-emerald-500/20 text-emerald-200 border-emerald-500/30 hover:bg-emerald-500/30";
  return <button onClick={onClick} className={`px-2.5 py-1 rounded-lg border text-xs font-medium ${cls}`}>{children}</button>;
}

function SmallToolbarButton({ children, onClick }) {
  return <button onClick={onClick} className="px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700/50 text-sm hover:bg-slate-700/80 hover:border-slate-600 active:scale-[0.97]">{children}</button>;
}

function EmptyBox({ children }) {
  return <div className="h-full rounded-xl bg-slate-800/40 border border-dashed border-slate-700/50 flex items-center justify-center text-slate-500 text-sm p-6 text-center">{children}</div>;
}

function ColorInput({ label, value, onChange }) {
  return (
    <label className="block rounded-xl bg-slate-800/40 border border-slate-700/40 p-2 hover:border-slate-600/50">
      <div className="text-[11px] text-slate-400 mb-1">{label}</div>
      <div className="flex items-center gap-2">
        <input type="color" value={value} onChange={(e) => onChange(e.target.value)} className="w-8 h-7 bg-transparent rounded cursor-pointer" />
        <input value={value} onChange={(e) => onChange(e.target.value)} className="min-w-0 flex-1 bg-slate-950/60 rounded-lg px-2 py-1 text-xs border border-slate-700/40 font-mono focus:border-sky-500/40 focus:outline-none" />
      </div>
    </label>
  );
}

function TextInput({ label, value, onChange }) {
  return (
    <label className="block">
      <div className="text-sm text-slate-400 mb-1">{label}</div>
      <input value={value} onChange={(e) => onChange(e.target.value)} className="w-full bg-slate-800/60 rounded-xl px-3 py-2 border border-slate-700/50 text-sm focus:border-sky-500/50 focus:outline-none focus:ring-1 focus:ring-sky-500/15" />
    </label>
  );
}

function Control({ label, value, min, max, step, onChange }) {
  return (
    <label className="block group">
      <div className="flex justify-between mb-1.5">
        <span className="text-sm text-slate-400 group-hover:text-slate-300">{label}</span>
        <span className="text-xs font-mono text-emerald-400/80 bg-emerald-500/10 px-1.5 py-0.5 rounded">{numberFormat(value, step)}</span>
      </div>
      <input type="range" value={value} min={min} max={max} step={step} onChange={(e) => onChange(Number(e.target.value))} className="w-full" />
    </label>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FTIRWebSimulator />);
  </script>
</body>
</html>
